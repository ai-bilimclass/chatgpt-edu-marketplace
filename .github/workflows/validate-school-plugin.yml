name: Validate school plugin

on:
  push:
    paths: ["plugins/school/**", ".agents/plugins/school/**", "scripts/validate_school_release.py", ".github/workflows/validate-school-plugin.yml"]
  pull_request:
    paths: ["plugins/school/**", ".agents/plugins/school/**", "scripts/validate_school_release.py", ".github/workflows/validate-school-plugin.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install python-docx lxml openpyxl PyYAML
      - name: Validate mirrors and run tests
        run: python scripts/validate_school_release.py
